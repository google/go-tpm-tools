# Restrict node-problem-detector to the pinned Google root certificates.
# Go reads SSL_CERT_FILE instead of the system certificate bundle. It also
# reads system certificate directories unless SSL_CERT_DIR is set. Point
# SSL_CERT_DIR at a nonexistent path on the read-only root filesystem to block
# directory lookups.
[Service]
Environment=SSL_CERT_FILE=/usr/share/oem/google_roots.pem
Environment=SSL_CERT_DIR=/nonexistent
