syntax = "proto3";

package teeserver;

option go_package = "github.com/google/go-tpm-tools/launcher/teeserver/proto/gen/teeserver";

message KeyHandle {
  string handle = 1;
}

message GetKeyEndorsementRequest {
  bytes challenge = 1;
  KeyHandle key_handle = 2;
  bool request_acpi_data = 3;
}

message GetAttestationEvidenceRequest {
  bytes challenge = 1;
}

message GetHostAttestationRequest {
  bytes challenge = 1;
}
