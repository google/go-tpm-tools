substitutions:
  '_BASE_IMAGE': 'cos-125-19216-395-112' # If left empty, will use the latest image in _BASE_IMAGE_FAMILY of _BASE_IMAGE_PROJECT
  '_BASE_IMAGE_FAMILY': 'cos-125-lts'
  '_BASE_IMAGE_PROJECT': 'cos-cloud'
  '_OUTPUT_IMAGE_PREFIX': 'confidential-space'
  '_OUTPUT_IMAGE_SUFFIX': ''
  '_OUTPUT_IMAGE_FAMILY': ''
  '_BUCKET_NAME': '${PROJECT_ID}_cloudbuild'
  '_VG_BASE_IMAGE': 'cos-125-19216-395-112'
  '_BC_BASE_IMAGE_PROJECT': 'confidential-space-images-dev'
  '_BC_BASE_IMAGE': 'cos-bc-guest-125-19216-532-28'
  '_BC_DEBUG_IMAGE': 'cos-bcdbg-guest-125-19216-532-28'
  '_BC_ACOS_BUCKET': ''
  '_LOUHI_TRIGGER_TOPIC': ''
  '_LOUHI_FLOW_ID': '41685197-997a-4b7b-82ac-c031bdeaddd3'
  '_WSD_CONTAINER_IMAGE_REF': 'us-docker.pkg.dev/confidential-space-images-dev/key-protection-module-images/key-protection-module:acdec5c'
  '_POLLING_INTERVAL': '10'
  '_ITA_API_KEY': 'fake-key'


steps:
- name: 'gcr.io/cloud-builders/curl'
  id: DownloadGoogleRoots
  args: ['-sSL', 'https://pki.goog/roots.pem', '-o', 'launcher/image/google_roots.pem']

# determine the base image
- name: 'gcr.io/cloud-builders/gcloud'
  id: BaseImageIdent
  env:
  - 'BASE_IMAGE=$_BASE_IMAGE'
  - 'BASE_IMAGE_FAMILY=$_BASE_IMAGE_FAMILY'
  - 'BASE_IMAGE_PROJECT=$_BASE_IMAGE_PROJECT'
  script: |
    #!/usr/bin/env bash

    # if BASE_IMAGE is not specified in the substitutions, use the latest image of the image family
    base_image=${BASE_IMAGE}
    if [ -z ${base_image} ]
    then
      echo "getting the latest image from project:" ${BASE_IMAGE_PROJECT} "family: "${BASE_IMAGE_FAMILY}
      base_image=$(gcloud compute images describe-from-family ${BASE_IMAGE_FAMILY} --project ${BASE_IMAGE_PROJECT} | grep name | cut -d ' ' -f 2)
    fi

    echo "base image:" ${base_image} "project:" ${BASE_IMAGE_PROJECT}
    echo ${base_image} > /workspace/base_image.txt

- name: rust:1.85-bullseye
  id: KeyManagerCompile
  entrypoint: /bin/bash
  args:
    - -c
    - |
      set -exuo pipefail
      # Install build dependencies for Rust
      apt-get update && apt-get install -y clang build-essential curl tar

      # Install CMake 3.28.3 from pre-compiled binaries for flexibility across environments
      curl -sSL https://github.com/Kitware/CMake/releases/download/v3.28.3/cmake-3.28.3-linux-x86_64.tar.gz -o cmake.tar.gz
      tar -zxvf cmake.tar.gz -C /opt/
      export PATH="/opt/cmake-3.28.3-linux-x86_64/bin:$$PATH"
      rm cmake.tar.gz

      # Install bindgen-cli (needed by BoringSSL's CMake build)
      cargo install bindgen-cli
      export PATH="$$HOME/.cargo/bin:$$PATH"

      # Build the Rust keymanager libraries
      cd keymanager
      cargo build --release

# `golang:1.24-bullseye` is needed to maintain `glibc` compatibility.
# Revert back to golang:1.24 COS 129 onwards.
- name: golang:1.24-bullseye
  id: LauncherCompile
  waitFor: ['KeyManagerCompile']
  entrypoint: /bin/bash
  args:
    - -c
    - |
      set -exuo pipefail
      # Install Go build tools (clang is needed for CGO)
      apt-get update && apt-get install -y clang pkg-config libssl-dev build-essential

      # Build the launcher with CGO enabled
      cd launcher/launcher
      export CGO_LDFLAGS="-L/workspace/keymanager/target/release"
      export GOTOOLCHAIN=auto
      go build -o ../image/launcher -ldflags="-extldflags=-Wl,-z,lazy -X 'main.BuildCommit=${SHORT_SHA}'"

- name: 'gcr.io/cloud-builders/gcloud'
  id: DownloadExpBinary
  entrypoint: 'gcloud'
  args: ['storage',
          'cp',
          'gs://confidential-space-images_third-party/confidential_space_experiments',
          './launcher/image/confidential_space_experiments']

# make sure the directory matches the base image
- name: 'gcr.io/cloud-builders/gcloud'
  id: DownloadGpuDrivers
  waitFor: ['BaseImageIdent']
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      set -ex
      BASE_IMAGE=$$(cat /workspace/base_image.txt)
      VERSION=$$(echo "$${BASE_IMAGE}" | grep -oE '[0-9]+-[0-9]+-[0-9]+$$' | tr '-' '.')
      if [[ -z "$${VERSION}" ]]; then
        echo "Failed to extract version from $${BASE_IMAGE}"
        exit 1
      fi

      gcloud storage cp \
        gs://cos-nvidia-gpu-drivers/NVIDIA-Linux-x86_64-595.58.03.run \
        "gs://cos-tools/$${VERSION}/lakitu/gpu_driver_versions.bin" \
        "gs://cos-tools/$${VERSION}/lakitu/nvidia-drivers-595.58.03.tgz" \
        ./launcher/image/

- name: 'gcr.io/cloud-builders/gcloud'
  id: DebugVgImageBuild
  waitFor: ['BaseImageIdent', 'LauncherCompile', 'DownloadExpBinary', 'DownloadGpuDrivers', 'DownloadGoogleRoots']
  env:
  - 'OUTPUT_IMAGE_NAME=${_OUTPUT_IMAGE_PREFIX}-vg-debug-${_OUTPUT_IMAGE_SUFFIX}'
  - 'OUTPUT_IMAGE_FAMILY=${_OUTPUT_IMAGE_FAMILY}-vg'
  - 'BUCKET_NAME=$_BUCKET_NAME'
  - 'BASE_IMAGE_PROJECT=$_BASE_IMAGE_PROJECT'
  - 'VG_BASE_IMAGE=$_VG_BASE_IMAGE'
  script: |
    #!/usr/bin/env bash
    set -exuo pipefail

    echo "building the debug image: ${OUTPUT_IMAGE_NAME} with the base image: ${VG_BASE_IMAGE}"
    gcloud builds submit --polling-interval=$_POLLING_INTERVAL --config=launcher/image/cloudbuild.yaml \
    --region us-west1 \
    --substitutions \
    _BASE_IMAGE=${VG_BASE_IMAGE},\
    _BASE_IMAGE_PROJECT=${BASE_IMAGE_PROJECT},\
    _OUTPUT_IMAGE_FAMILY=${OUTPUT_IMAGE_FAMILY}-debug,\
    _OUTPUT_IMAGE_NAME=${OUTPUT_IMAGE_NAME},\
    _IMAGE_ENV=debug,\
    _CS_LICENSE=projects/confidential-space-images/global/licenses/confidential-space-debug,\
    _BUCKET_NAME=${BUCKET_NAME},\
    _PRELOAD_SCRIPT=vgpreload.sh,\
    _OEM_SIZE=900M,\
    _DISK_SIZE_GB=12
    exit

