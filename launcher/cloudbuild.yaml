- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: TriggerLouhiFlow
  waitFor: ['DebugBcImageBuildAndExport', 'HardenedBcImageBuildAndExport']
  env:
  - 'BC_ACOS_BUCKET=$_BC_ACOS_BUCKET'
  - 'OUTPUT_IMAGE_PREFIX=$_OUTPUT_IMAGE_PREFIX'
  - 'OUTPUT_IMAGE_SUFFIX=$_OUTPUT_IMAGE_SUFFIX'
  - 'LOUHI_TRIGGER_TOPIC=$_LOUHI_TRIGGER_TOPIC'
  - 'LOUHI_FLOW_ID=$_LOUHI_FLOW_ID'
  - 'COMMIT_SHA=${COMMIT_SHA}'
  - 'SHORT_SHA=${SHORT_SHA}'
  - 'PR_NUMBER=$_PR_NUMBER'
  - 'HEAD_REPO_URL=$_HEAD_REPO_URL'
  script: |
    #!/usr/bin/env bash
    set -exuo pipefail

    if [ -z "${LOUHI_TRIGGER_TOPIC}" ] || [ -z "${LOUHI_FLOW_ID}" ]; then
      echo "Louhi trigger topic or flow ID not specified. Skipping trigger."
      exit 0
    fi

    PR_EMAIL=$(git log -1 --format='%ae' 2>/dev/null || true)
    if [[ "${PR_EMAIL}" != *@google.com ]]; then
      PR_EMAIL="noreply@google.com"
    fi

    # Cloud Build populates _PR_NUMBER for initial PR webhooks, but omits it during re-triggered
    # check runs or manual builds. Fall back to querying the GitHub API for COMMIT_SHA.
    PR_NUMBER="${PR_NUMBER:-}"
    if [ -z "${PR_NUMBER}" ]; then
      echo "PR_NUMBER is empty. Attempting to fetch PR number from GitHub API for commit ${COMMIT_SHA}..."
      PR_NUMBER=$(python3 launcher/fetch_pr_number.py "${COMMIT_SHA}" 2>/dev/null || true)
    fi

    DEBUG_URL="gs://${BC_ACOS_BUCKET}/${OUTPUT_IMAGE_PREFIX}-bc-debug-${OUTPUT_IMAGE_SUFFIX}.tar.gz"
    HARDENED_URL="gs://${BC_ACOS_BUCKET}/${OUTPUT_IMAGE_PREFIX}-bc-hardened-${OUTPUT_IMAGE_SUFFIX}.tar.gz"

    echo "Triggering Louhi flow ${LOUHI_FLOW_ID}"
    gcloud pubsub topics publish "${LOUHI_TRIGGER_TOPIC}" \
      --message='{
        "flow": "'"${LOUHI_FLOW_ID}"'",
        "userParameters": {
          "_GUEST_WORKLOAD_ACOS_DEBUG_GS_URL": "'"${DEBUG_URL}"'",
          "_GUEST_WORKLOAD_ACOS_HARDENED_GS_URL": "'"${HARDENED_URL}"'",
          "_PR_EMAIL": "'"${PR_EMAIL}"'",
          "_PR_NUMBER": "'"${PR_NUMBER}"'",
          "_HEAD_REPO_URL": "'"${HEAD_REPO_URL}"'",
          "_COMMIT_SHA": "'"${COMMIT_SHA}"'",
          "_SHORT_SHA": "'"${SHORT_SHA}"'"
        },
        "gitParameters": {
          "commitSha": "'"${COMMIT_SHA}"'"
        }
      }'

