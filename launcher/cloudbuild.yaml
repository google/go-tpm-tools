  id: MeasureHardenedImage
  waitFor: ['ExportHardenedImage']
  env:
  - 'OUTPUT_IMAGE_NAME=${_OUTPUT_IMAGE_PREFIX}-hardened-${_OUTPUT_IMAGE_SUFFIX}'
  - 'PROJECT_ID=$PROJECT_ID'
