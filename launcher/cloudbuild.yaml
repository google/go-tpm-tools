  - 'SHORT_SHA=${SHORT_SHA}'
  - 'BASE_IMAGE_PROJECT=$_BASE_IMAGE_PROJECT'
  - 'VG_BASE_IMAGE=$_VG_BASE_IMAGE'
  script: |
