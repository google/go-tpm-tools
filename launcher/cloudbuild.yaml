    #!/usr/bin/env bash
    echo "downloading hardened image ${OUTPUT_IMAGE_NAME}"
    gcloud storage cp gs://confidential-space-images-dev_raw-images/${OUTPUT_IMAGE_NAME}.tar.gz .
