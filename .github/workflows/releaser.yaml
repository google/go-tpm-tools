name: release

on:
  push:
    branches:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      refToBuild:
        description: 'Branch, tag or commit SHA1 to build'
        required: false
        type: string

permissions:
  contents: read

jobs:
  release:
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        # We can cross-compile from Linux to macOS and Windows. See .goreleaser.yaml
        # So running just on ubuntu is sufficient.
        go-version: [1.26.x]
        os: [ubuntu-latest]

    name: Release (${{ matrix.os}}, Go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.refToBuild }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - shell: bash
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist/${{ matrix.os }}
          key: ${{ matrix.go }}-${{ env.sha_short }}
          lookup-only: true
      - name: Install Linux packages
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout="30" && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout="30" libssl-dev
        if: runner.os == 'Linux'
      - name: Build all modules
        run: go build -v ./... ./agent/... ./cmd/... ./launcher/... ./verifier/...
      - name: Run GoReleaser (build & package only)
        uses: goreleaser/goreleaser-action@90a3faa9d0182683851fbfa97ca1a2cb983bfca3 # v6.2.1
        if: success() && (startsWith(github.ref, 'refs/tags/') || startsWith(inputs.refToBuild, 'refs/tags/')) && steps.cache.outputs.cache-hit != 'true'
        with:
          version: latest
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Authenticate to Google Cloud
        if: success() && (startsWith(github.ref, 'refs/tags/') || startsWith(inputs.refToBuild, 'refs/tags/')) && steps.cache.outputs.cache-hit != 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'

      - name: Set up Cloud SDK
        if: success() && (startsWith(github.ref, 'refs/tags/') || startsWith(inputs.refToBuild, 'refs/tags/')) && steps.cache.outputs.cache-hit != 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Clean up prior staged artifacts in OSS Exit Gate repository
        if: success() && (startsWith(github.ref, 'refs/tags/') || startsWith(inputs.refToBuild, 'refs/tags/')) && steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          EXISTING_PKGS="$(gcloud artifacts packages list \
            --project=oss-exit-gate-prod \
            --location=us \
            --repository=go-tpm-tools--githubreleases \
            --format='value(name)' 2>/dev/null || true)"
          for pkg in ${EXISTING_PKGS}; do
            gcloud artifacts packages delete "${pkg}" \
              --project=oss-exit-gate-prod \
              --location=us \
              --repository=go-tpm-tools--githubreleases \
              --quiet || true
          done

      - name: Stage release artifacts and trigger OSS Exit Gate
        if: success() && (startsWith(github.ref, 'refs/tags/') || startsWith(inputs.refToBuild, 'refs/tags/')) && steps.cache.outputs.cache-hit != 'true'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_NAME: ${{ github.ref_name }}
          IS_LATEST: true
          IS_DRAFT: false
          IS_PRERELEASE: false
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          STAGE_DIR="$(mktemp -d "${RUNNER_TEMP}/exit-gate-stage.XXXXXX")"
          trap 'rm -rf "${STAGE_DIR}"' EXIT
          find dist -maxdepth 1 -type f ! -name 'artifacts.json' ! -name 'config.yaml' ! -name 'metadata.json' -exec cp {} "${STAGE_DIR}/" \;
          ls -la "${STAGE_DIR}"
          PKG_VERSION="$(printf '%s' "${RELEASE_TAG#v}" | tr '[:upper:]/+' '[:lower:]--' | sed 's/^[^a-z0-9]*//; s/[^a-z0-9._-]/-/g; s/[^a-z0-9]*$//')"
          PKG_VERSION="${PKG_VERSION:-0.0.0}"
          gcloud artifacts generic upload \
            --project=oss-exit-gate-prod \
            --repository=go-tpm-tools--githubreleases \
            --location=us \
            --package=go-tpm-tools \
            --version="${PKG_VERSION}" \
            --source-directory="${STAGE_DIR}"
          python3 - <<'PY' > manifest.json
          import json, os
          is_draft = os.environ['IS_DRAFT'].lower() == 'true'
          is_pre = os.environ['IS_PRERELEASE'].lower() == 'true'
          is_latest = False if (is_draft or is_pre) else (os.environ['IS_LATEST'].lower() == 'true')
          manifest = {
              'publish_all': True,
              'registry_config': {
                  'github_releases': {
                      'name': os.environ['RELEASE_NAME'],
                      'tag': os.environ['RELEASE_TAG'],
                      'is_latest': is_latest,
                      'is_draft': is_draft,
                      'is_prerelease': is_pre,
                  }
              }
          }
          print(json.dumps(manifest, indent=2))
          PY
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/go-tpm-tools/githubreleases/manifests/manifest-${RUN_ID}-${RUN_ATTEMPT}.json"
