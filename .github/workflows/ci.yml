name: CI
on:
  push:
    tags:
      - v*
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        go-version: [1.26.x]
        # TODO: Get this working on windows-latest
        os: [ubuntu-latest]
        architecture: [x32, x64]
        include:
          - os: macos-latest
            architecture: arm64
            go-version: 1.26.x
          - os: macos-14-large
            architecture: x64
            go-version: 1.26.x
    name: Generate/Build/Test (${{ matrix.os }}, ${{ matrix.architecture }}, Go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    steps:
      # Pinned to commit SHA to satisfy blanket security policy (zizmor)
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go-version }}
          architecture: ${{ matrix.architecture }}
          cache: false
      - name: Install Protoc
        uses: arduino/setup-protoc@149f6c87b92550901b26acd1632e11c3662e381f # v1.3.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: "3.20.1"
      - name: Install protoc-gen-go
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.28.0
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
      - name: Install Build Dependencies (Linux)
        run: sudo apt-get update && sudo apt-get install -y cmake clang pkg-config libssl-dev
        if: runner.os == 'Linux' && matrix.architecture == 'x64'
      - name: Install bindgen-cli
        run: cargo install bindgen-cli
        if: runner.os == 'Linux' && matrix.architecture == 'x64'
      - name: Build KeyManager Rust library
        run: |
          cd keymanager
          cargo build --release
        if: runner.os == 'Linux' && matrix.architecture == 'x64'
      - name: Check Protobuf Generation
        run: |
          go generate ./... ./agent/... ./cmd/... ./launcher/... ./verifier/...
          git diff -G'^[^/]' --exit-code
      - name: Install Linux 64-bit packages
        run: sudo apt-get -y install libssl-dev
        if: runner.os == 'Linux' && matrix.architecture == 'x64'
      - name: Install Linux 32-bit packages
        run: sudo dpkg --add-architecture i386; sudo apt-get update; sudo apt-get -y install libssl-dev:i386 libgcc-s1:i386 gcc-multilib
        if: runner.os == 'Linux' && matrix.architecture == 'x32'
      - name: Install Mac packages
        run: |
          brew install openssl
        if: runner.os == 'macOS'
      - name: Install Windows packages
        run: choco install openssl
        if: runner.os == 'Windows'
      - name: Build all modules except agent, launcher, and keymanager
        run: go build -v ./... ./cmd/... ./verifier/...
      - name: Build agent module
        run: go build -v ./agent/...
        if: runner.os == 'Linux'
      - name: Build keymanager module
        run: go build -v ./keymanager/...
        if: runner.os == 'Linux' && matrix.architecture == 'x64'
      - name: Build launcher module
        run: go build -v -ldflags="-extldflags=-Wl,-z,lazy" ./launcher/...
        if: runner.os == 'Linux'
      - name: Run specific tests under root permission
        run: |
          GO_EXECUTABLE_PATH=$(which go)
          sudo $GO_EXECUTABLE_PATH test -v -ldflags="-extldflags=-Wl,-z,lazy" -run "TestFetchImageSignaturesDockerPublic" ./launcher
        if: runner.os == 'Linux'
      - name: Run all tests in launcher to capture potential data race
        run: go test -v -ldflags="-extldflags=-Wl,-z,lazy" -race ./launcher/...
        if: (runner.os == 'Linux') && matrix.architecture == 'x64'
      - name: Test all modules except agent, launcher, and keymanager
        run: go test -v ./... ./cmd/... ./verifier/... -skip='TestCacheConcurrentSetGet|TestHwAttestationPass|TestHardwareAttestationPass'
      - name: Test agent module
        run: go test -v ./agent/...
        if: runner.os == 'Linux'
      - name: Test keymanager module
        run: go test -v ./keymanager/...
        if: runner.os == 'Linux' && matrix.architecture == 'x64'

  lint:
    strategy:
      matrix:
        go-version: [1.26.x]
        os: [ubuntu-latest]
        dir: ["./", "./agent", "./cmd", "./launcher", "./keymanager"]
    name: Lint ${{ matrix.dir }} (${{ matrix.os }}, Go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
      - name: Install Build Dependencies (Linux)
        run: sudo apt-get update && sudo apt-get install -y cmake clang pkg-config libssl-dev
      - name: Install bindgen-cli
        run: cargo install bindgen-cli
      - name: Build KeyManager Rust library
        run: |
          cd keymanager
          cargo build --release
      # Pinned to commit SHA to satisfy blanket security policy (zizmor)
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@537aa1903e5d359d0b27dbc19ddd22c5087f3fbc # v3.2.0
        with:
          version: latest
          working-directory: ${{ matrix.dir }}
          args: >
            -D errcheck
            -E stylecheck
            -E goimports
            -E misspell
            -E revive
            -E gofmt
            -E goimports
            --exclude-use-default=false
            --max-same-issues=0
            --max-issues-per-linter=0
            --timeout 2m

  lintc:
    strategy:
      matrix:
        go-version: [1.26.x]
        os: [ubuntu-latest]
    name: Lint CGO (${{ matrix.os }}, Go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    steps:
      # Pinned to commit SHA to satisfy blanket security policy (zizmor)
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
      - name: Install Build Dependencies (Linux)
        run: sudo apt-get update && sudo apt-get install -y cmake clang pkg-config libssl-dev
      - name: Install bindgen-cli
        run: cargo install bindgen-cli
      - name: Build KeyManager Rust library
        run: |
          cd keymanager
          cargo build --release
      - name: Check for CGO Warnings (gcc)
        run: CGO_CFLAGS=-Werror CC=gcc go build ./...
      - name: Check for CGO Warnings (clang)
        run: CGO_CFLAGS=-Werror CC=clang go build ./...

  keep-sorted:
    name: Keep Sorted Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: false
      - name: Install keep-sorted
        run: go install github.com/google/keep-sorted@v0.9.1
      - name: Check keep-sorted
        run: |
          if [ -n "${GITHUB_BASE_REF}" ]; then
            git fetch origin ${GITHUB_BASE_REF} --depth=1
            BASE_REF="origin/${GITHUB_BASE_REF}"
          else
            BASE_REF="HEAD~1"
          fi
          git diff --name-only -z --diff-filter=d "$BASE_REF" HEAD | while IFS= read -r -d '' file; do
            if [ -f "$file" ]; then
              keep-sorted "$file"
            fi
          done
          git diff --exit-code
